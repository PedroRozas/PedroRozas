<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Pedro Rozas, full-stack developer">
<style>
.flow { animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -40; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
<defs>
<radialGradient id="glow" cx="0.82" cy="0.5" r="0.55"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0.05" cy="0" r="0.5"><stop offset="0" stop-color="#f5a524" stop-opacity="0.10"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
<clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="300" fill="#0d1117"/>
<rect width="1200" height="300" fill="url(#dots)"/>
<rect width="1200" height="300" fill="url(#glow)"/>
<rect width="1200" height="300" fill="url(#glow2)"/>
</g>
<text x="64" y="92" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#2dd4bf">FULL-STACK DEVELOPER · CHILE</text>
<text x="62" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Pedro Rozas</text>
<text x="64" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" fill="#9198a1">I build products with NestJS, React and Next.js,</text>
<text x="64" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" fill="#9198a1">and the AI features that run inside them.</text>
